<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

    <!-- Google Fonts: Space Grotesk replaced with Clash Display + Cabinet Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        crypto: {
                            bg:     '#0b0f19',
                            card:   '#111827',
                            border: '#1f2937',
                            accent: '#f59e0b',
                            green:  '#10b981',
                            muted:  '#6b7280',
                            text:   '#f9fafb',
                        }
                    },
                    animation: {
                        'pulse-dot': 'pulseDot 1.6s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseDot: {
                            '0%, 100%': { opacity: '1' },
                            '50%':      { opacity: '0.2' },
                        },
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0b0f19;
            background-image:
                radial-gradient(ellipse 60% 40% at 70% 0%,  rgba(245,158,11,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 10% 80%, rgba(16,185,129,0.06) 0%, transparent 60%);
        }
        .grid-bg {
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .tag-chip:hover {
            background-color: rgba(245,158,11,0.15);
            border-color: rgba(245,158,11,0.5);
            color: #f59e0b;
        }
        .track-btn:active { transform: scale(0.98); }
        input::placeholder { color: #4b5563; }
        input:focus {
            outline: none;
            border-color: rgba(245,158,11,0.6);
            box-shadow: 0 0 0 3px rgba(245,158,11,0.08);
        }
    </style>
</head>
<body class="grid-bg min-h-screen font-display text-crypto-text flex items-center justify-center px-4 py-12">

<div class="w-full max-w-md">

    <!-- Live badge -->
    <div class="flex items-center gap-2 mb-6">
        <span class="flex items-center gap-2 text-xs font-mono text-crypto-green bg-emerald-950/60 border border-emerald-800/50 rounded-full px-3 py-1 tracking-widest uppercase">
            <span class="w-1.5 h-1.5 rounded-full bg-crypto-green animate-pulse-dot"></span>
            Live Prices
        </span>
    </div>

    <!-- Heading -->
    <h1 class="text-5xl font-extrabold leading-none tracking-tight mb-1 text-crypto-text">
        Crypto<br>
        <span class="text-crypto-accent">Tracker</span> &amp; Alert
    </h1>
    <p class="text-crypto-muted text-sm font-mono mt-4 mb-10 tracking-wide">
        Monitor real-time prices · set custom alerts
    </p>

    <!-- Form card -->
    <div class="bg-crypto-card border border-crypto-border rounded-2xl p-6">

        <form th:action="@{/track}" method="post">

            <!-- Input label -->
            <label for="coins" class="block text-xs font-mono tracking-widest text-crypto-muted uppercase mb-2">
                Coins to Track
            </label>

            <!-- Input field -->
            <div class="relative flex items-center mb-4">
                <i class="ti ti-currency-bitcoin absolute left-3 text-crypto-muted text-lg pointer-events-none"></i>
                <input
                        id="coins"
                        name="coins"
                        type="text"
                        placeholder="bitcoin, solana, ethereum"
                        required
                        class="w-full bg-[#0d1320] border border-[#1f2937] rounded-xl pl-10 pr-4 py-3 text-sm font-mono text-crypto-text transition-all duration-150"
                />
            </div>

            <!-- Quick-pick chips -->
            <div class="flex flex-wrap gap-2 mb-5">
                <button type="button" onclick="addCoin('bitcoin')"
                        class="tag-chip font-mono text-xs px-3 py-1 rounded-full border border-[#1f2937] text-crypto-muted transition-all duration-150 cursor-pointer bg-transparent">
                    bitcoin
                </button>
                <button type="button" onclick="addCoin('ethereum')"
                        class="tag-chip font-mono text-xs px-3 py-1 rounded-full border border-[#1f2937] text-crypto-muted transition-all duration-150 cursor-pointer bg-transparent">
                    ethereum
                </button>
                <button type="button" onclick="addCoin('solana')"
                        class="tag-chip font-mono text-xs px-3 py-1 rounded-full border border-[#1f2937] text-crypto-muted transition-all duration-150 cursor-pointer bg-transparent">
                    solana
                </button>
                <button type="button" onclick="addCoin('dogecoin')"
                        class="tag-chip font-mono text-xs px-3 py-1 rounded-full border border-[#1f2937] text-crypto-muted transition-all duration-150 cursor-pointer bg-transparent">
                    dogecoin
                </button>
                <button type="button" onclick="addCoin('cardano')"
                        class="tag-chip font-mono text-xs px-3 py-1 rounded-full border border-[#1f2937] text-crypto-muted transition-all duration-150 cursor-pointer bg-transparent">
                    cardano
                </button>
                <button type="button" onclick="addCoin('xrp')"
                        class="tag-chip font-mono text-xs px-3 py-1 rounded-full border border-[#1f2937] text-crypto-muted transition-all duration-150 cursor-pointer bg-transparent">
                    xrp
                </button>
            </div>

            <!-- Divider -->
            <div class="border-t border-crypto-border mb-5"></div>

            <!-- Submit button -->
            <button
                    type="submit"
                    class="track-btn w-full flex items-center justify-center gap-2 bg-crypto-accent hover:bg-amber-400 text-[#0b0f19] font-bold text-sm rounded-xl py-3 transition-all duration-150 tracking-wide"
            >
                <i class="ti ti-trending-up text-lg"></i>
                Track Prices
            </button>

            <!-- Hint -->
            <p class="text-center text-crypto-muted text-xs font-mono mt-3">
                Comma-separate multiple coins &middot; Refreshes every 30s
            </p>

        </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-[#374151] text-xs font-mono mt-6 tracking-wider">
        POWERED BY COINGECKO API
    </p>

</div>

<script>
    function addCoin(coin) {
        const input = document.getElementById('coins');
        const current = input.value.trim();
        const coins = current
            ? current.split(',').map(c => c.trim()).filter(Boolean)
            : [];
        if (!coins.includes(coin)) {
            coins.push(coin);
            input.value = coins.join(', ');
        }
        input.focus();
    }
</script>

</body>
</html>
